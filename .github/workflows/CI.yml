name: CI

on:
  push:
    paths-ignore:
      - '.gitignore'
      - 'appveyor.yml'
      - 'hero.jpg'
      - 'README.md'
  pull_request:
    paths-ignore:
      - '.gitignore'
      - 'appveyor.yml'
      - 'hero.jpg'
      - 'README.md'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Install
        run: npm ci --ignore-scripts
      - name: Validate the AoT compatibility surface
        run: |
          npm run check:fesl
          node --check clear_aot_sessions.js
          node --check ea_capture.js
          node --check ea_selftest.js
          npm run lint:alpha
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - uses: actions/upload-artifact@v7
        with:
          name: Xenia-WebServices
          path: dist
          if-no-files-found: error
